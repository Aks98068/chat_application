{{ define "base" }}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {{ if .Title }}
            {{ .Title }} | {{ .AppName }}
        {{ else }}
            {{ .AppName }}
        {{ end }}
    </title>

    {{ if .Description }}

    <meta
        name="description"
        content="{{ .Description }}"
    >

    {{ end }}

    <!-- ===================================================== -->
    <!-- BOOTSTRAP 5.3.3                                      -->
    <!-- ===================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- ===================================================== -->
    <!-- APPLICATION CSS                                      -->
    <!-- ===================================================== -->

    <link
        rel="stylesheet"
        href="/css/app.css"
    >

</head>

<body class="d-flex flex-column min-vh-100">

    <!-- ===================================================== -->
    <!-- NAVBAR                                                -->
    <!-- ===================================================== -->

    {{ template "navbar" . }}

    <!-- ===================================================== -->
    <!-- PAGE CONTENT                                          -->
    <!-- ===================================================== -->

    <main class="flex-grow-1">

        {{ template "content" . }}

    </main>

    <!-- ===================================================== -->
    <!-- FOOTER                                                -->
    <!-- ===================================================== -->

    {{ template "footer" . }}

    <!-- ===================================================== -->
    <!-- BOOTSTRAP JAVASCRIPT                                  -->
    <!-- ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- ===================================================== -->
    <!-- APPLICATION JAVASCRIPT                                -->
    <!-- ===================================================== -->

    <script src="/js/app.js"></script>

</body>

</html>
{{ end }}
